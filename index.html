<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Test: Sistem Energi Surya </title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">

<!--
╔══════════════════════════════════════════════════════════════════════╗
║          PANDUAN SETUP FIREBASE (BACA SEBELUM DIPAKAI!)             ║
╠══════════════════════════════════════════════════════════════════════╣
║                                                                      ║
║  LANGKAH 1 — Buat Proyek Firebase (GRATIS)                          ║
║  • Buka: https://console.firebase.google.com                        ║
║  • Klik "Add project" → beri nama (mis: "pretest-energisurya")      ║
║  • Ikuti wizard, matikan Google Analytics (opsional)                ║
║                                                                      ║
║  LANGKAH 2 — Aktifkan Realtime Database                             ║
║  • Di menu kiri: Build → Realtime Database → Create database        ║
║  • Pilih lokasi (Singapore terdekat), Start in TEST MODE (30 hari)  ║
║  • Untuk keamanan jangka panjang, atur Rules:                       ║
║    { "rules": { ".read": false, ".write": true } }                  ║
║                                                                      ║
║  LANGKAH 3 — Ambil konfigurasi                                      ║
║  • Di Firebase Console: Project Settings (⚙) → Your apps           ║
║  • Klik ikon </> (Web) → Register app → salin firebaseConfig        ║
║                                                                      ║
║  LANGKAH 4 — Tempel konfigurasi di bawah ini                        ║
║  • Cari komentar "GANTI DENGAN CONFIG FIREBASE ANDA"                ║
║  • Tempel nilai dari console.firebase.google.com                    ║
║                                                                      ║
║  LANGKAH 5 — Lihat data siswa                                       ║
║  • Firebase Console → Realtime Database → Data                      ║
║  • Semua hasil siswa tersimpan di: hasil_pretest/<nama>_<timestamp> ║
║                                                                      ║
╚══════════════════════════════════════════════════════════════════════╝
-->

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ▼▼▼ GANTI DENGAN CONFIG FIREBASE ANDA (dari Project Settings) ▼▼▼
  const firebaseConfig = {
    apiKey: "AIzaSyCN78ftgQy3lmWzlaDgVphz3BweANsyOY8",
  authDomain: "abccc-abaf5.firebaseapp.com",
  databaseURL: "https://abccc-abaf5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "abccc-abaf5",
  storageBucket: "abccc-abaf5.firebasestorage.app",
  messagingSenderId: "523120030175",
  appId: "1:523120030175:web:f5b3bd058cc20c03ab146a"
  };
  // ▲▲▲ SAMPAI DI SINI ▲▲▲

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Expose ke global supaya bisa dipanggil dari submitTest()
  window._firebaseDb = db;
  window._firebaseRef = ref;
  window._firebasePush = push;
  window._firebaseSet = set;
  window._firebaseReady = true;
  console.log("✅ Firebase berhasil diinisialisasi");
</script>

<style>
  :root {
    --sun: #FFB800;
    --sun-glow: #FF8C00;
    --sky: #0a1628;
    --sky2: #0d2347;
    --panel-blue: #1a3a6e;
    --accent: #00E5FF;
    --accent2: #FFB800;
    --correct: #00E676;
    --wrong: #FF5252;
    --card-bg: rgba(255,255,255,0.04);
    --border: rgba(0,229,255,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--sky);
    font-family: 'Exo 2', sans-serif;
    color: #e8f4ff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; top:0; left:0; width:100%; height:100%;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(2px 2px at 15% 45%, rgba(255,184,0,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 50%, rgba(255,255,255,0.4) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 0 20px 60px; position: relative; z-index:1; }

  .header {
    text-align: center;
    padding: 40px 0 20px;
    position: relative;
  }

  .sun-animation {
    width: 100px; height: 100px;
    margin: 0 auto 20px;
    position: relative;
  }
  .sun-core {
    width: 60px; height: 60px;
    background: radial-gradient(circle, #fff7aa, #FFB800, #FF8C00);
    border-radius: 50%;
    position: absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 30px 10px rgba(255,184,0,0.6), 0 0 60px 20px rgba(255,140,0,0.3);
    animation: pulse 2s ease-in-out infinite;
  }
  .sun-rays {
    width: 100%; height: 100%;
    animation: spin 12s linear infinite;
    position: absolute;
  }
  .sun-rays::before, .sun-rays::after {
    content: '';
    position: absolute; top:0; left:50%;
    width: 3px; height: 100%;
    background: linear-gradient(to bottom, transparent 0%, rgba(255,184,0,0.8) 30%, rgba(255,184,0,0.8) 70%, transparent 100%);
    transform: translateX(-50%);
    border-radius: 3px;
  }
  .sun-rays::after { transform: translateX(-50%) rotate(45deg); }
  .ray-extra { position:absolute; top:0; left:50%; width:3px; height:100%; background: linear-gradient(to bottom, transparent, rgba(255,184,0,0.6), transparent); transform: translateX(-50%) rotate(90deg); border-radius:3px; }
  .ray-extra2 { position:absolute; top:0; left:50%; width:3px; height:100%; background: linear-gradient(to bottom, transparent, rgba(255,184,0,0.6), transparent); transform: translateX(-50%) rotate(135deg); border-radius:3px; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 30px 10px rgba(255,184,0,0.6), 0 0 60px 20px rgba(255,140,0,0.3); } 50% { box-shadow: 0 0 40px 15px rgba(255,184,0,0.9), 0 0 80px 30px rgba(255,140,0,0.5); } }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    background: linear-gradient(135deg, #FFB800, #fff, #00E5FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    letter-spacing: 2px;
  }
  .header .subtitle {
    font-size: 0.95rem;
    color: rgba(0,229,255,0.7);
    margin-top: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    height: 10px;
    margin: 24px 0 0;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #FFB800, #00E5FF);
    border-radius: 20px;
    transition: width 0.5s ease;
    width: 0%;
    box-shadow: 0 0 8px rgba(0,229,255,0.6);
  }
  .progress-label {
    text-align: right;
    font-size: 0.78rem;
    color: rgba(0,229,255,0.6);
    margin-top: 6px;
    font-family: 'Orbitron', monospace;
  }

  .student-form {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin: 28px 0;
    backdrop-filter: blur(10px);
  }
  .student-form h3 {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 200px; }
  .form-group label { display: block; font-size: 0.78rem; color: rgba(0,229,255,0.6); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .form-group input, .form-group select {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(0,229,255,0.25);
    border-radius: 8px;
    padding: 10px 14px;
    color: #e8f4ff;
    font-family: 'Exo 2', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: #0d2347; }

  .simulation-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin: 0 0 28px;
    text-align: center;
  }
  .simulation-box h3 {
    font-family: 'Orbitron', monospace;
    font-size: 0.78rem;
    color: var(--accent2);
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .sim-svg { width: 100%; max-width: 700px; }

  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin: 0 0 20px;
    backdrop-filter: blur(6px);
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .question-card::before {
    content: '';
    position: absolute; top:0; left:0;
    width: 4px; height: 100%;
    background: linear-gradient(to bottom, var(--accent2), var(--accent));
    border-radius: 4px 0 0 4px;
  }
  .question-card.answered { border-color: rgba(0,229,255,0.4); }
  .q-number {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    color: var(--accent2);
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  .q-text {
    font-size: 1rem;
    font-weight: 600;
    color: #e8f4ff;
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .q-image {
    margin: 0 0 18px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(0,229,255,0.15);
  }
  .q-image svg { width:100%; display:block; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-family: 'Exo 2', sans-serif;
    font-size: 0.92rem;
    color: #cde4ff;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) {
    background: rgba(0,229,255,0.07);
    border-color: rgba(0,229,255,0.35);
    transform: translateX(4px);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { background: rgba(0,230,118,0.12); border-color: var(--correct); color: #b9ffd8; }
  .option-btn.wrong   { background: rgba(255,82,82,0.1);  border-color: var(--wrong); color: #ffd0d0; }
  .option-key {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 6px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex; align-items:center; justify-content:center;
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem; font-weight: 700;
  }
  .option-btn.correct .option-key { background: var(--correct); color: #003d1a; border-color: var(--correct); }
  .option-btn.wrong   .option-key { background: var(--wrong); color: #fff; border-color: var(--wrong); }

  .feedback {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .feedback.correct { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.3); color: var(--correct); }
  .feedback.wrong   { background: rgba(255,82,82,0.08); border: 1px solid rgba(255,82,82,0.3); color: var(--wrong); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-5px); } to { opacity:1; transform:translateY(0); } }

  .submit-wrap { text-align:center; margin: 30px 0; }
  .submit-btn {
    background: linear-gradient(135deg, #FFB800, #FF8C00);
    color: #1a0a00;
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 16px 48px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(255,184,0,0.35);
  }
  .submit-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(255,184,0,0.55); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #result-section { display:none; }
  .result-card {
    background: linear-gradient(135deg, rgba(10,22,40,0.95), rgba(13,35,71,0.95));
    border: 1px solid rgba(255,184,0,0.4);
    border-radius: 20px;
    padding: 36px 32px;
    margin: 20px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    content: '';
    position: absolute; top:-40%; left:-40%;
    width: 180%; height: 180%;
    background: radial-gradient(ellipse at center, rgba(255,184,0,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .score-circle {
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 4px solid;
    display: flex; flex-direction:column; align-items:center; justify-content:center;
    margin: 0 auto 20px;
    position: relative;
  }
  .score-num {
    font-family: 'Orbitron', monospace;
    font-size: 2.4rem;
    font-weight: 900;
    line-height: 1;
  }
  .score-label { font-size: 0.72rem; letter-spacing: 2px; opacity: 0.7; margin-top: 2px; }
  .result-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.3rem;
    font-weight: 900;
    margin-bottom: 8px;
  }
  .result-sub { font-size: 0.88rem; color: rgba(200,220,255,0.6); margin-bottom: 24px; }

  .rekap-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin: 20px 0;
    text-align: left;
  }
  .rekap-table th {
    background: rgba(0,229,255,0.08);
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(0,229,255,0.2);
  }
  .rekap-table td { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .rekap-table tr:last-child td { border-bottom: none; }
  .rekap-table .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .badge-correct { background: rgba(0,230,118,0.15); color: var(--correct); border: 1px solid rgba(0,230,118,0.3); }
  .badge-wrong   { background: rgba(255,82,82,0.12); color: var(--wrong);   border: 1px solid rgba(255,82,82,0.3); }

  .student-info-display {
    display: flex; gap: 16px; flex-wrap:wrap; justify-content:center;
    margin-bottom: 22px;
  }
  .info-chip {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 6px 16px;
    font-size: 0.82rem;
  }
  .info-chip span { color: var(--accent2); font-weight: 700; }

  .action-btns { display:flex; gap: 14px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    padding: 12px 28px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-outline:hover { background: rgba(0,229,255,0.1); }
  .btn-print {
    background: linear-gradient(135deg, #0a4a6e, #0d2d5a);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    padding: 12px 28px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-print:hover { background: rgba(0,229,255,0.15); }

  .dots-wrap { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin: 10px 0 24px; }
  .q-dot {
    width:14px; height:14px; border-radius:50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s;
    cursor: pointer;
    font-size: 0;
  }
  .q-dot.done { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 6px rgba(255,184,0,0.5); }

  /* ── STATUS FIREBASE ── */
  .firebase-status {
    position: fixed;
    bottom: 20px; right: 20px;
    padding: 10px 18px;
    border-radius: 30px;
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    z-index: 999;
    transition: all 0.4s ease;
    display: none;
  }
  .firebase-status.saving {
    display: block;
    background: rgba(255,184,0,0.15);
    border: 1px solid rgba(255,184,0,0.4);
    color: #FFB800;
  }
  .firebase-status.success {
    display: block;
    background: rgba(0,230,118,0.12);
    border: 1px solid rgba(0,230,118,0.4);
    color: #00E676;
  }
  .firebase-status.error {
    display: block;
    background: rgba(255,82,82,0.12);
    border: 1px solid rgba(255,82,82,0.4);
    color: #FF5252;
  }

  @media print {
    body { background: white !important; color: black !important; }
    body::before { display:none; }
    .no-print { display:none !important; }
    .result-card { border-color: #ccc !important; background: white !important; color:black !important; }
    .rekap-table th { background: #eee !important; color: #333 !important; }
    .rekap-table td { color: #333 !important; }
    .badge-correct { color: green !important; }
    .badge-wrong { color: red !important; }
    #test-section { display:none !important; }
    .firebase-status { display:none !important; }
  }
</style>
</head>
<body>

<!-- STATUS FIREBASE (pojok kanan bawah) -->
<div class="firebase-status no-print" id="fb-status"></div>

<div class="container">

  <!-- HEADER -->
  <div class="header no-print">
    <div class="sun-animation">
      <div class="sun-rays"><div class="ray-extra"></div><div class="ray-extra2"></div></div>
      <div class="sun-core"></div>
    </div>
    <h1>PRE-TEST<br>SISTEM ENERGI SURYA</h1>
    <p class="subtitle">Good Luck · 10 Soal</p>
  </div>

  <!-- STUDENT INFO -->
  <div class="student-form no-print" id="student-form">
    <h3>▸ DATA SISWA</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="s-name" placeholder="Masukkan nama lengkap...">
      </div>
      
      <div class="form-group">
        <label>Kelas</label>
        <input type="text" id="s-class" placeholder="Contoh: XI IPA 1">
      </div>
      <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="s-date">
      </div>
    </div>
  </div>

  <!-- TEST SECTION -->
  <div id="test-section">
    <div class="no-print">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">0 / 10 Terjawab</div>
    </div>

    <div class="dots-wrap no-print" id="dots-wrap"></div>

    <!-- SIMULATION -->
    <div class="simulation-box no-print">
      <h3>⚡ Simulasi Aliran Energi Panel Surya</h3>
      <svg class="sim-svg" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="sg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff7aa"/>
            <stop offset="40%" stop-color="#FFB800"/>
            <stop offset="100%" stop-color="#FF6600"/>
          </radialGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <polygon points="0 0, 7 3.5, 0 7" fill="#00E5FF"/>
          </marker>
          <marker id="arrow-y" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <polygon points="0 0, 7 3.5, 0 7" fill="#FFB800"/>
          </marker>
        </defs>
        <circle cx="50" cy="100" r="32" fill="url(#sg)" filter="url(#glow)"/>

// Render questions
const container = document.getElementById('questions-container');
questions.forEach((q, i) => {
  const div = document.createElement('div');
  div.className = 'question-card';
  div.id = `q-${q.num}`;
  let imgHTML = '';
  if (q.img) {
    imgHTML = `<div class="q-image">${getImageSVG(q.img)}</div>`;
  }
  const opts = q.options.map((o, j) => `
    <button class="option-btn" id="opt-${q.num}-${j}" onclick="selectAnswer(${q.num}, '${keys[j]}', ${i})">
      <span class="option-key">${keys[j]}</span>
      <span>${o}</span>
    </button>`).join('');
  div.innerHTML = `
    <div class="q-number">SOAL ${q.num} / 10</div>
    <div class="q-text">${q.text}</div>
    ${imgHTML}
    <div class="options">${opts}</div>
    <div class="feedback" id="fb-${q.num}"></div>`;
  container.appendChild(div);
});

function selectAnswer(qNum, choice, idx) {
  if (userAnswers[qNum] !== undefined) return;
  userAnswers[qNum] = choice;
  const q = questions[idx];
  const isCorrect = choice === q.answer;
  const correctIdx = keys.indexOf(q.answer);
  q.options.forEach((_, j) => {
    const btn = document.getElementById(`opt-${qNum}-${j}`);
    btn.disabled = true;
    if (j === correctIdx && isCorrect) btn.classList.add('correct');
    else if (keys[j] === choice && !isCorrect) btn.classList.add('wrong');
  });
  const fb = document.getElementById(`fb-${qNum}`);
  fb.style.display = 'block';
  fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  fb.textContent = isCorrect ? `✓ ${q.feedback_correct}` : `✗ ${q.feedback_wrong}`;
  document.getElementById(`q-${qNum}`).classList.add('answered');
  document.getElementById(`dot-${qNum}`).classList.add('done');
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress-fill').style.width = (answered / 10 * 100) + '%';
  document.getElementById('progress-label').textContent = `${answered} / 10 Terjawab`;
}

// ─── FUNGSI SIMPAN KE FIREBASE ─────────────────────────────────────────────
function showFbStatus(type, msg) {
  const el = document.getElementById('fb-status');
  el.className = `firebase-status ${type}`;
  el.textContent = msg;
  if (type === 'success') {
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
}

async function saveToFirebase(data) {
  // Tunggu Firebase siap (maks 5 detik)
  let waited = 0;
  while (!window._firebaseReady && waited < 50) {
    await new Promise(r => setTimeout(r, 100));
    waited++;
  }

  if (!window._firebaseReady || !window._firebaseDb) {
    showFbStatus('error', '⚠ Firebase belum dikonfigurasi. Lihat panduan setup di komentar HTML.');
    console.warn('Firebase tidak siap. Pastikan firebaseConfig sudah diisi dengan benar.');
    return false;
  }

  try {
    showFbStatus('saving', '💾 Menyimpan ke database...');
    const db = window._firebaseDb;
    const refFn = window._firebaseRef;
    const pushFn = window._firebasePush;

    // Simpan ke path: hasil_pretest/<nama>_<timestamp>
    const sanitizedName = data.nama.replace(/[^a-zA-Z0-9]/g, '_').substring(0, 30);
    const timestamp = Date.now();
    const key = `${sanitizedName}_${timestamp}`;
    const dbRef = refFn(db, `hasil_pretest/${key}`);

    await window._firebaseSet(dbRef, data);
    showFbStatus('success', `✅ Tersimpan! Nilai ${data.nilai} untuk ${data.nama}`);
    console.log('✅ Data berhasil disimpan ke Firebase:', key);
    return true;
  } catch (err) {
    showFbStatus('error', `❌ Gagal menyimpan: ${err.message}`);
    console.error('Firebase error:', err);
    return false;
  }
}
// ─── AKHIR FUNGSI FIREBASE ─────────────────────────────────────────────────

function submitTest() {
  const answered = Object.keys(userAnswers).length;
  if (answered < 10) {
    if (!confirm(`Baru ${answered} dari 10 soal terjawab. Lanjutkan dan lihat hasil?`)) return;
  }

  const name = document.getElementById('s-name').value || '—';

  const cls  = document.getElementById('s-class').value || '—';
  const date = document.getElementById('s-date').value  || '—';

  let correct = 0;
  const detailJawaban = {};
  questions.forEach(q => {
    const jawaban = userAnswers[q.num] || '—';
    const benar = jawaban === q.answer;
    if (benar) correct++;
    detailJawaban[`soal_${q.num}`] = {
      jawaban_siswa: jawaban,
      
      status: benar ? 'benar' : 'salah',
      skor: benar ? 10 : 0
    };
  });
  const score = correct * 10;

  let predikat;
  if (score >= 90) predikat = 'SANGAT BAIK';
  else if (score >= 80) predikat = 'BAIK';
  else if (score >= 70) predikat = 'CUKUP';
  else if (score >= 60) predikat = 'KURANG';
  else predikat = 'PERLU BIMBINGAN';

  // ─── DATA YANG DIKIRIM KE FIREBASE ───────────────────────────────
  const dataFirebase = {
    nama: name,

    kelas: cls,
    tanggal: date,
    nilai: score,
    jumlah_benar: correct,
    jumlah_salah: 10 - correct,
    predikat: predikat,
    waktu_submit: new Date().toISOString(),
    detail_jawaban: detailJawaban
  };
  // Kirim ke Firebase (async, tidak menghalangi tampilan hasil)
  saveToFirebase(dataFirebase);
  // ─── AKHIR DATA FIREBASE ──────────────────────────────────────────

  // Tampilkan hasil di layar (sama seperti sebelumnya)
  window.scrollTo({top:0, behavior:'smooth'});
  document.getElementById('test-section').style.display = 'none';
  document.getElementById('student-form').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';

  document.getElementById('result-student-info').innerHTML = `
    <div class="info-chip">Nama: <span>${name}</span></div>
  
    <div class="info-chip">Kelas: <span>${cls}</span></div>
    <div class="info-chip">Tanggal: <span>${date}</span></div>`;

  const sc = document.getElementById('score-circle');
  const sn = document.getElementById('score-num');
  sn.textContent = score;
  if (score >= 80) { sc.style.borderColor = '#00E676'; sn.style.color = '#00E676'; }
  else if (score >= 60) { sc.style.borderColor = '#FFB800'; sn.style.color = '#FFB800'; }
  else { sc.style.borderColor = '#FF5252'; sn.style.color = '#FF5252'; }

  let grade, msg;
  if (score >= 90) { grade = 'SANGAT BAIK ⭐'; msg = 'Pemahaman konsep energi surya sangat baik!'; }
  else if (score >= 80) { grade = 'BAIK 🌟'; msg = 'Sebagian besar konsep sudah dipahami dengan baik.'; }
  else if (score >= 70) { grade = 'CUKUP 📘'; msg = 'Perlu sedikit pendalaman materi energi surya.'; }
  else if (score >= 60) { grade = 'KURANG 📖'; msg = 'Materi perlu dipelajari lebih mendalam sebelum praktik.'; }
  else { grade = 'PERLU BIMBINGAN ❗'; msg = 'Disarankan mempelajari ulang konsep dasar sistem energi surya.'; }
  document.getElementById('result-title').textContent = grade;
  document.getElementById('result-sub').textContent = `Benar: ${correct}/10 soal · ${msg}`;

  const tbody = document.getElementById('rekap-body');
  tbody.innerHTML = '';
  questions.forEach((q) => {
    const ans = userAnswers[q.num] || '—';
    const isOk = ans === q.answer;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-family:Orbitron,monospace;font-size:0.8rem;color:rgba(200,220,255,0.6)">${q.num}</td>
      <td style="max-width:220px;font-size:0.82rem;color:#cde4ff">${q.text.substring(0,70)}${q.text.length>70?'...':''}</td>
      <td style="font-family:Orbitron,monospace;font-weight:700;font-size:0.9rem;color:${isOk?'#00E676':'#FF5252'}">${ans}</td>
     
      <td><span class="badge ${isOk?'badge-correct':'badge-wrong'}">${isOk?'✓ Benar':'✗ Salah'}</span></td>
      <td style="font-family:Orbitron,monospace;font-size:0.9rem;font-weight:700;color:${isOk?'#00E676':'#FF5252'}">${isOk?10:0}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('total-score-cell').textContent = score;
  document.getElementById('total-score-cell').style.color = score>=70?'#00E676':'#FF5252';
}

function resetTest() {
  userAnswers = {};
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('student-form').style.display = 'block';
  document.getElementById('test-section').style.display = 'block';
  questions.forEach(q => {
    q.options.forEach((_, j) => {
      const btn = document.getElementById(`opt-${q.num}-${j}`);
      btn.disabled = false;
      btn.classList.remove('correct','wrong');
    });
    const fb = document.getElementById(`fb-${q.num}`);
    fb.style.display = 'none';
    document.getElementById(`q-${q.num}`).classList.remove('answered');
    document.getElementById(`dot-${q.num}`).classList.remove('done');
  });
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-label').textContent = '0 / 10 Terjawab';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
